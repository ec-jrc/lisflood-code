[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = build dist .* bin src data
markers =
    slow: mark a test as slow.
    pathroot: mark a test needed for --pathroot argument
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning
env =
    D:NUMEXPR_MAX_THREADS=12
;    D:PCRASTER_NR_WORKER_THREADS=4 gives errors with pcraster.multicore - need changes in many hydro modules
; run pytest tests/ -m "slow" before release !!!
; Parallel test options (default): run the suite across CPU cores with pytest-xdist
; while still collecting coverage (pytest-cov combines per-worker coverage into one
; report). "-n auto" uses all available cores; "--dist loadscope" keeps every test
; in a class on the same worker, which is required for safe parallelism here because
; tests reuse per-class output dirs and different files share 'out/' leaf names
; (cross-worker collisions are avoided by the per-worker output isolation in
; tests/test_utils.py). "-x" is omitted because stop-on-first-failure is racy under
; xdist. This runs both locally and in CI at full speed with coverage.
addopts = -ra -l --cov=lisflood --cov-config=.coveragerc -m "slow or not slow" -vv -n auto --dist loadscope
; Serial fallback (uncomment this line and comment the parallel one above) - useful
; for debugging a single test or when pytest-xdist is unavailable; keeps -x.
; addopts = -ra -x -l --cov=lisflood --cov-config=.coveragerc -m "slow or not slow" -vv
